; PlatformIO configuration for ESP32 Gesture Recognition Glove
; Team 2 — Senior Design Project

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default
upload_speed = 460800
; Port auto-detection is enabled by default.
; Uncomment and adjust if manual port specification is required on your machine:
; upload_port = COM7
; monitor_port = COM7
build_src_filter = +<main.cpp>

lib_deps =
    tockn/MPU6050_tockn@^1.5.2

; Build flags for debug output
build_flags = -DCORE_DEBUG_LEVEL=1

; ============================================================
; STANDALONE TEST ENVIRONMENT: Single Flex Sensor Benchmark
; Upload with: pio run -e test_single_flex --target upload
; Or open firmware/test_single_flex/test_single_flex.ino in Arduino IDE
; ============================================================
[env:test_single_flex]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_src_filter = +<../test_single_flex/test_single_flex.cpp>

; ============================================================
; STANDALONE TEST ENVIRONMENT: Single Flex Sensor + LED
; Upload with: pio run -e test_flex_led --target upload
; Or open firmware/test_flex_led/test_flex_led.ino in Arduino IDE
; ============================================================
[env:test_flex_led]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; Port auto-detection is enabled by default.
; Uncomment and adjust if manual port specification is required on your machine:
; upload_port = COM7
; monitor_port = COM7
build_src_filter = +<../test_flex_led/test_flex_led.cpp>

; ============================================================
; ALTERNATIVE BOARD: SparkFun IoT RedBoard ESP32
; Uncomment the section below and comment out [env:esp32dev]
; if using the SparkFun board instead.
; Pin assignments may differ - check config.h
; ============================================================
; [env:sparkfun_redboard]
; platform = espressif32
; board = sparkfun_esp32_iot_redboard
; framework = arduino
; monitor_speed = 115200
; monitor_filters = esp32_exception_decoder, default
; upload_speed = 921600
; lib_deps =
;     tockn/MPU6050_tockn@^1.5.2
; build_flags = -DCORE_DEBUG_LEVEL=1 -DUSE_SPARKFUN_BOARD

