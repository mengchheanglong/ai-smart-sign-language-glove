; PlatformIO configuration for AI Smart Sign Language Glove
; Team 2 — Senior Design Project

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default
upload_speed = 921600

lib_deps =
    tockn/MPU6050_tockn@^1.5.2

; Build flags for debug output
build_flags = -DCORE_DEBUG_LEVEL=1

; ============================================================
; ALTERNATIVE BOARD: SparkFun IoT RedBoard ESP32
; Uncomment the section below and comment out [env:esp32dev]
; if using the SparkFun board instead.
; Pin assignments may differ - check config.h
; ============================================================
; [env:sparkfun_redboard]
; platform = espressif32
; board = sparkfun_esp32_iot_redboard
; framework = arduino
; monitor_speed = 115200
; monitor_filters = esp32_exception_decoder, default
; upload_speed = 921600
; lib_deps =
;     tockn/MPU6050_tockn@^1.5.2
; build_flags = -DCORE_DEBUG_LEVEL=1 -DUSE_SPARKFUN_BOARD

